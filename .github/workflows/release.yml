name: Build portable release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version label for the zip (optional, e.g. v1.0.0)'
        required: false
        default: ''

permissions:
  contents: write

jobs:
  test-macos-arm64:
    name: macOS arm64 tests
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        # Must cover every module the tests import at collection time. yasbd-lib
        # is here because test_segmentation.py exercises the sentence splitter
        # directly, and PyYAML because the i18n and config tests parse the YAML
        # files; translator/mlx_service import openai+httpx lazily so their
        # pure-logic tests need no network stack.
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<2.3" pytest "yasbd-lib>=0.15,<1.0" "PyYAML>=6.0"
      - name: Run offline platform tests
        run: python -m pytest -q
      - name: Check shell scripts
        run: bash -n install.sh start.sh update.sh

  build:
    # Every release-producing job must gate on the test job, so a red test run
    # can never publish an artifact (the macOS package already did this).
    needs: test-macos-arm64
    runs-on: windows-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Build portable zip
        shell: pwsh
        run: |
          $version = "${{ github.event.inputs.version }}"
          if (-not $version -and "${{ github.ref_type }}" -eq "tag") { $version = "${{ github.ref_name }}" }
          if ($version) { ./build_release.ps1 -Version $version } else { ./build_release.ps1 }

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiveTranslate-portable
          path: release/*.zip

      - name: Attach to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/*.zip

  package-macos-arm64:
    name: Package macOS arm64 source bundle
    needs: test-macos-arm64
    runs-on: macos-14
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Build source bundle
        shell: bash
        run: |
          version="${{ github.event.inputs.version }}"
          if [[ -z "$version" && "${{ github.ref_type }}" == "tag" ]]; then version="${{ github.ref_name }}"; fi
          [[ -n "$version" ]] || version="dev-${GITHUB_SHA::8}"
          mkdir -p release/LiveTranslate-macos-arm64-${version}
          rsync -a --exclude '.git' --exclude '.venv' --exclude '__pycache__' \
            --exclude 'release' ./ release/LiveTranslate-macos-arm64-${version}/
          tar -czf release/LiveTranslate-macos-arm64-${version}.tar.gz \
            -C release LiveTranslate-macos-arm64-${version}
      - name: Upload macOS artifact
        uses: actions/upload-artifact@v7
        with:
          name: LiveTranslate-macos-arm64
          path: release/LiveTranslate-macos-arm64-*.tar.gz
      - name: Attach macOS artifact to GitHub Release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          files: release/LiveTranslate-macos-arm64-*.tar.gz
