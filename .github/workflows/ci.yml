name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

# A superseded run (rapid pushes to the same ref) is cancelled instead of
# stacking; the newest commit's run is the one that matters.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test-macos-arm64:
    name: macOS arm64 tests
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install portaudio
        # PyAudio ships no macOS wheels; the sdist build needs the portaudio
        # headers. Idempotent when the runner image already provides them.
        run: brew install portaudio
      - name: Install test dependencies
        # The release.yml recipe covers collection-time imports only; the
        # packages below additionally unskip the full suite so a PR sees the
        # same 466 passed / 4 skipped as a complete local environment:
        # main.py imports torch before PyQt6 at module level, and the tests
        # importorskip silero-vad, openai, httpx, pyaudio and pyobjc.
        # fastapi+uvicorn+faster-whisper install asr_server's serving stack,
        # so its "app carries its configuration" case (the deployment shape
        # from REMOTE_ASR.md) runs here; the complementary stack-absent case
        # skips here and still runs in the light release.yml environment —
        # the swap is count-neutral. The other 3 skips are the bundle tests
        # that need a project .venv, which a CI checkout lacks.
        run: |
          python -m pip install --disable-pip-version-check \
            "numpy>=1.24,<2.3" \
            pytest \
            "yasbd-lib>=0.15,<1.0" \
            "PyYAML>=6.0" \
            "PyQt6>=6.5.0,<7" \
            "torch==2.8.0" \
            "torchaudio==2.8.0" \
            "silero-vad>=5.0,<7" \
            "soundfile>=0.12" \
            "openai>=1.0.0" \
            "httpx>=0.28.0,<1.0" \
            "psutil>=5.9.0" \
            "PyAudio>=0.2.14" \
            "pyobjc-core>=9.2" \
            "pyobjc-framework-Cocoa>=9.2" \
            "fastapi>=0.141,<1.0" \
            "uvicorn>=0.52,<1.0" \
            "faster-whisper>=1.0,<2"
      - name: Run tests
        run: python -m pytest -q

  windows-smoke:
    # The suite's Windows share on the light recipe (no torch/Qt/pyobjc
    # stacks, so their cases skip) stayed green since its first machine run:
    # 228 passed / 60 skipped. Guards the Windows-only surfaces (install
    # entrypoints, the WASAPI capture contract, config parsing) that the
    # macOS job cannot see.
    name: Windows smoke
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: '3.12'
      - name: Install test dependencies
        # The light collection-time recipe, same as release.yml's test job —
        # torch/Qt/pyobjc stacks stay absent, so their cases skip.
        run: python -m pip install --disable-pip-version-check "numpy>=1.24,<2.3" pytest "yasbd-lib>=0.15,<1.0" "PyYAML>=6.0"
      - name: Run tests
        run: python -m pytest -q
