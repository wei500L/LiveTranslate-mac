context_turns_hint: >-
  Include the last N translation pairs as context, for better term

  consistency and pronoun resolution. 0 = none.

  History is sent as real conversation turns, including when "no system

  role" is checked.

  Two caveats: if the system prompt contains a {context} placeholder the

  history is embedded there instead and no turns are sent; and

  translation-specialized models (such as the local HY-MT) handle turns

  well but can break on a context block inside the prompt.
