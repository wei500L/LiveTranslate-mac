timeout_hint: >-
  Total timeout for one translation request. A sentence that times out is

  shown as an error.

  The first request of a session is usually much slower: a cloud endpoint

  cold-starts (over 10s is common) and a local model loads its weights.

  Raise this if the first sentence of every meeting fails.
