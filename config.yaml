# LiveTrans Configuration

audio:
  # System audio mode: auto (Windows loopback enabled, macOS M0 microphone-only).
  system_audio: "auto"
  # Device name (null = platform default; __disabled__ is retained for old configs)
  device: null
  # Microphone: auto selects the macOS default input; Windows keeps it disabled.
  mic_device: "auto"
  # Sample rate for capture
  sample_rate: 16000
  # Audio chunk duration in seconds for VAD processing (32ms = Silero VAD native window)
  chunk_duration: 0.032

asr:
  # ASR engine: whisper, funasr, anime-whisper, gigaam (Russian-only)
  asr_engine: "funasr"
  # Model size: tiny, base, small, medium, large-v3
  model_size: "medium"
  # FunASR model: sensevoice-small, funasr-nano-2512, funasr-mlt-nano-2512
  funasr_model: "sensevoice-small"
  # Device: auto selects MPS on Apple Silicon, CUDA on Windows, then CPU
  device: "auto"
  # Compute type: float16, int8_float16, int8
  compute_type: "float16"
  # Language: auto, en, ja, zh, ko, etc. Ignored by fixed-language engines
  # (GigaAM is Russian-only and always reports "ru").
  language: "auto"
  # Minimum speech duration (seconds) before sending to ASR
  min_speech_duration: 1.0
  # Maximum speech duration (seconds) before forced segmentation
  max_speech_duration: 8.0
  # VAD threshold (0.0 - 1.0)
  vad_threshold: 0.5
  # SenseVoice input padding bucket in seconds (0 = disabled)
  sensevoice_pad_seconds: 0.5
  # faster-whisper input padding bucket in seconds (0 = disabled)
  whisper_pad_seconds: 0.5

translation:
  # OpenAI-compatible API settings. These are only the bootstrap values: the
  # models list in user_settings.json takes over as soon as the control panel
  # applies its settings, and each entry there can override every field below.
  # Override with LIVETRANSLATE_API_BASE / LIVETRANSLATE_API_KEY when desired.
  api_base: "http://127.0.0.1:1234/v1"
  # Empty means "a local server that does not check the key" — LM Studio,
  # Ollama's /v1 and the managed MLX service all ignore it. A placeholder is
  # substituted before the request, because recent OpenAI SDKs refuse to
  # construct a client with an empty key at all.
  api_key: ""
  model: "hunyuan-mt-chimera-7b"
  # Target language for translation
  target_language: "zh"
  # Source language hint (auto = detect from ASR)
  source_language: "auto"
  # How many recent (source, translation) pairs to give the model as context.
  # They are sent as real conversation turns, which is what lets it resolve
  # pronouns and keep terminology consistent across a session. Two caveats:
  #   * if the system prompt below contains {context}, the history is embedded
  #     there instead and no turns are sent (one mechanism, never both);
  #   * translation-specialized models can be sensitive to how context arrives.
  #     The managed HY-MT model works with turns but breaks on a {context}
  #     block — see the comments on hy_mt_model_config() in mlx_service.py.
  context_window: 10
  # Max tokens for one translation. Also the ceiling that stops a runaway
  # generation; a subtitle-length reply uses well under 50.
  max_tokens: 512
  # Sampling temperature. 0.0 is greedy: the same sentence always gets the same
  # subtitle, which is usually what you want for translation.
  temperature: 0.3
  # Enable streaming output
  streaming: true
  # System prompt template ({source_lang}, {target_lang}, {context} will be
  # replaced; {source_lang}/{target_lang} become English names like "Russian").
  # A long, multi-line instruction block is fine for general chat models, but
  # translation-specialized ones may continue it instead of following it.
  system_prompt: |
    你是俄语课堂的实时翻译助手。请将课堂中的{source_lang}内容翻译成{target_lang}。
    场景：学校或大学课堂，内容可能包括教师讲解、学生提问、课堂讨论、例句、术语、板书和作业要求。
    规则：
    - 只输出一条准确、自然的{target_lang}译文，不要解释、分析、前缀、引号或多个候选。
    - 保持教师讲解或学生发言的逻辑、语气、否定、条件、因果、时间和指代关系，不擅自补充未说内容。
    - 课程术语、人名、地名、书名、课程名、缩写、数字、公式和符号使用目标语言通行表达；没有把握时保留原文，不要臆造。
    - 结合课堂语境和近期上下文纠正俄语 ASR 的错词、同音词和断句；无法确定时忠实翻译，不要编造。
    - 可适度压缩口语重复和填充词，但不要省略定义、例子、数字、公式、作业要求或关键限定。
    - 保持适合实时字幕的简洁长度；原句未完时翻译当前可确定的内容，不添加说明。

    近期课堂上下文：
    {context}

subtitle:
  # Font family (auto = platform CJK default)
  font_family: "auto"
  # Font size
  font_size: 28
  # Font color (hex)
  font_color: "#FFFFFF"
  # Outline color
  outline_color: "#000000"
  # Outline width
  outline_width: 2
  # Subtitle position from bottom (pixels)
  bottom_margin: 80
  # Show original text above translation
  show_original: true
  # Original text font size
  original_font_size: 20
  # Original text color
  original_color: "#CCCCCC"
  # Subtitle display duration (seconds)
  display_duration: 5.0
  # Window opacity (0.0 - 1.0)
  opacity: 0.95
